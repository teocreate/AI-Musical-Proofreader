[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-musical-proofreader"
version = "0.1.0"
description = "Intelligent post-OMR correction system for MuseScore Studio scores"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "AI Musical Proofreader" }]
keywords = ["music", "omr", "musicxml", "musescore", "proofreading"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Intended Audience :: End Users/Desktop",
]

dependencies = [
    "pydantic>=2.7",
    "lxml>=5.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
ui = ["PySide6>=6.6"]
cv = ["opencv-python-headless>=4.9", "PyMuPDF>=1.24", "Pillow>=10.0"]
ai = ["anthropic>=0.34", "httpx>=0.27"]
samples = ["music21>=9.1"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=24.3",
    "ruff>=0.4",
    "mypy>=1.9",
]
all = [
    "ai-musical-proofreader[ui,cv,ai,dev]",
]

[project.scripts]
ai-proofreader = "ai_proofreader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_proofreader = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008",   # function call in default argument - used deliberately for pydantic Fields
    "RUF012", # mutable class attrs need ClassVar - noisy with pydantic models
    # Typographic punctuation (en/em dashes, sharps, flats) is deliberate throughout the prose
    # and the musical symbols in user-facing strings; these rules exist to catch homoglyph
    # attacks in identifiers, which is not what is happening here.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: long-running tests (performance benchmarks)",
    "ui: requires PySide6",
]
filterwarnings = ["error::DeprecationWarning:ai_proofreader.*"]

[tool.mypy]
python_version = "3.12"
packages = ["ai_proofreader"]
strict = false
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
